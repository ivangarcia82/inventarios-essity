services:
  postgres:
    image: postgres:15-alpine
    container_name: essity_inventory_postgres
    restart: always
    environment:
      POSTGRES_USER: essity_user
      POSTGRES_PASSWORD: essity_password
      POSTGRES_DB: essity_inventory_db
    ports:
      - "5441:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
